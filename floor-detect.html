<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Floor Builder — 3 punti per piano</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; color: #eee; font-family: system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* TOP BAR */
    #topbar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 1rem;
      padding: 0.5rem 1rem;
      background: #161616; border-bottom: 1px solid #222;
    }
    #status {
      flex: 1;
      font-size: 0.8rem;
    }
    #status .step-label { color: #c8a97e; font-weight: 600; }
    #status .step-sub   { color: #666; margin-left: 0.4rem; }
    .dots { display: flex; gap: 4px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #555; }
    .dot.done  { background: #c8a97e; border-color: #c8a97e; }
    .dot.active{ background: transparent; border-color: #fff; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    button { background: #222; border: 1px solid #333; color: #ccc; padding: 0.35rem 0.75rem; border-radius: 3px; cursor: pointer; font-size: 0.75rem; transition: background 0.15s; white-space: nowrap; }
    button:hover { background: #2c2c2c; }
    button.primary { background: #c8a97e; color: #111; border-color: #c8a97e; font-weight: 600; }
    button.primary:hover { background: #d4b88e; }
    button:disabled { opacity: 0.35; cursor: default; }

    /* MAIN AREA */
    #main { flex: 1; display: flex; min-height: 0; }

    /* CANVAS */
    #canvasWrap { flex: 1; position: relative; overflow: hidden; background: #000; cursor: crosshair; }
    #canvasWrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* SIDEBAR */
    #sidebar { width: 260px; flex-shrink: 0; border-left: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; }

    .panel { padding: 0.75rem; border-bottom: 1px solid #1a1a1a; }
    .panel-title { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: #555; margin-bottom: 0.5rem; }

    /* Boundary list */
    #bList { overflow-y: auto; flex: 1; }
    .b-item { display: flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.75rem; border-bottom: 1px solid #151515; }
    .b-item.active { background: #1a1609; }
    .b-item.pending { opacity: 0.4; }
    .b-num { font-size: 0.65rem; color: #555; width: 16px; flex-shrink: 0; }
    .b-name { flex: 1; font-size: 0.72rem; color: #bbb; }
    .b-item.done .b-name { color: #888; }
    .b-item.active .b-name { color: #c8a97e; }
    .b-pts { font-size: 0.65rem; color: #555; font-family: monospace; }
    .b-item.done .b-pts { color: #4a4; }
    .b-del { background: none; border: none; color: #444; cursor: pointer; padding: 0 3px; font-size: 0.8rem; }
    .b-del:hover { color: #f66; background: none; }

    /* Output */
    #outputWrap { flex-shrink: 0; border-top: 1px solid #222; display: flex; flex-direction: column; max-height: 200px; }
    #outputHeader { display: flex; align-items: center; justify-content: space-between; padding: 0.4rem 0.75rem; background: #161616; }
    #outputHeader span { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: #555; }
    #output { flex: 1; overflow-y: auto; padding: 0.5rem 0.75rem; font-family: monospace; font-size: 0.65rem; line-height: 1.6; color: #5c5; white-space: pre-wrap; word-break: break-all; background: #0a0a0a; }

    @media (max-width: 700px) {
      #main { flex-direction: column; }
      #sidebar { width: 100%; border-left: none; border-top: 1px solid #222; max-height: 200px; }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div id="status">
    <span class="step-label" id="stepLabel">Boundary 1 di 10</span>
    <span class="step-sub"  id="stepSub">Top edificio</span>
  </div>
  <div class="dots" id="dotRow">
    <div class="dot active" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
  </div>
  <button onclick="undoPoint()" id="btnUndo" disabled>↩ Punto</button>
  <button onclick="undoBoundary()" id="btnUndoBnd" disabled>↩ Linea</button>
  <button onclick="copyOutput()" class="primary" id="btnCopy" disabled>📋 Copia SVG</button>
</div>

<!-- MAIN -->
<div id="main">
  <div id="canvasWrap">
    <svg id="svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
      <image id="bgImg" href="assets/frames/frame_0060.jpg" x="0" y="0" width="1280" height="720"/>

      <!-- Completed boundaries -->
      <g id="gCompleted"></g>

      <!-- Current boundary in progress -->
      <g id="gCurrent">
        <polyline id="curLine" points="" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" stroke-dasharray="5,3"/>
        <line id="curGuide" x1="0" y1="0" x2="0" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="3,3"/>
        <!-- dots for placed points -->
        <circle id="cp0" r="4" fill="#c8a97e" stroke="#fff" stroke-width="1" visibility="hidden"/>
        <circle id="cp1" r="4" fill="#c8a97e" stroke="#fff" stroke-width="1" visibility="hidden"/>
        <circle id="cp2" r="4" fill="#c8a97e" stroke="#fff" stroke-width="1" visibility="hidden"/>
      </g>

      <!-- Crosshair cursor -->
      <g id="gCursor" pointer-events="none">
        <line id="chH" x1="0" y1="0" x2="0" y2="0" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>
        <line id="chV" x1="0" y1="0" x2="0" y2="0" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>
        <circle id="chDot" r="3" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
        <text id="chCoord" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.5)"></text>
      </g>
    </svg>
  </div>

  <div id="sidebar">
    <div class="panel">
      <div class="panel-title">Zone da definire</div>
    </div>
    <div id="bList"></div>
    <div id="outputWrap">
      <div id="outputHeader">
        <span>Output SVG</span>
        <button onclick="copyOutput()" id="btnCopy2">📋 Copia</button>
      </div>
      <div id="output">Completa le boundary per generare il codice.</div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   DATA
============================================================ */
const BOUNDARY_NAMES = [
  'Top edificio',
  'Rooftop / Piano 8°',
  'Piano 8° / Piano 7°',
  'Piano 7° / Piano 6°',
  'Piano 6° / Piano 5°',
  'Piano 5° / Piano 4°',
  'Piano 4° / Piano 3°',
  'Piano 3° / Piano 2°',
  'Piano 2° / Piano 1°',
  'Bottom edificio',
];
const ZONE_NAMES = ['Rooftop','Piano 8°','Piano 7°','Piano 6°','Piano 5°','Piano 4°','Piano 3°','Piano 2°','Piano 1°'];
const HAS_PLAN_IDX = 6; // Piano 3° = zone index 6 (between boundary 6 and 7)

let boundaries   = []; // array of {name, pts:[{x,y},{x,y},{x,y}]}
let currentPts   = []; // 0-2 points for boundary in progress
let cursorPos    = {x: 640, y: 360};
let done         = false;

/* ============================================================
   SVG UTILS
============================================================ */
const svg = document.getElementById('svg');

function toSVG(clientX, clientY) {
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const svgPt = pt.matrixTransform(svg.getScreenCTM().inverse());
  return { x: Math.round(svgPt.x), y: Math.round(svgPt.y) };
}

function ptsToStr(pts) {
  return pts.map(p => `${p.x},${p.y}`).join(' ');
}

/* ============================================================
   RENDER
============================================================ */
function renderCompleted() {
  const g = document.getElementById('gCompleted');
  g.innerHTML = '';

  // Draw filled zones between consecutive boundaries
  for (let i = 0; i < boundaries.length - 1; i++) {
    const top = boundaries[i].pts;
    const bot = boundaries[i + 1].pts;
    const isHasPlan = (i === HAS_PLAN_IDX);

    // Zone fill (subtle)
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    const zonePts = [...top, ...[...bot].reverse()];
    poly.setAttribute('points', ptsToStr(zonePts));
    poly.setAttribute('fill', 'rgba(200,169,126,0.05)');
    poly.setAttribute('stroke', 'none');
    g.appendChild(poly);

    // Separator line (the BOTTOM boundary of each zone, except last)
    if (i < boundaries.length - 1) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      line.setAttribute('points', ptsToStr(bot));
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', isHasPlan ? 'rgba(200,169,126,0.8)' : 'rgba(255,255,255,0.45)');
      line.setAttribute('stroke-width', isHasPlan ? '1.5' : '0.9');
      if (isHasPlan) line.setAttribute('stroke-dasharray', '5,3');
      g.appendChild(line);
    }

    // Zone label (center of zone)
    const cy = Math.round((top[1].y + bot[1].y) / 2);
    const cx = top[1].x;
    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.setAttribute('x', cx - 10);
    lbl.setAttribute('y', cy + 4);
    lbl.setAttribute('text-anchor', 'end');
    lbl.setAttribute('font-family', 'system-ui');
    lbl.setAttribute('font-size', '11');
    lbl.setAttribute('fill', 'rgba(255,255,255,0.5)');
    lbl.textContent = ZONE_NAMES[i] || `Zone ${i}`;
    g.appendChild(lbl);
  }

  // Draw TOP boundary line
  if (boundaries.length > 0) {
    const topLine = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    topLine.setAttribute('points', ptsToStr(boundaries[0].pts));
    topLine.setAttribute('fill', 'none');
    topLine.setAttribute('stroke', 'rgba(255,80,80,0.6)');
    topLine.setAttribute('stroke-width', '1');
    g.appendChild(topLine);
  }

  // Draw all boundary dots
  boundaries.forEach(b => {
    b.pts.forEach(p => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', '3');
      c.setAttribute('fill', '#c8a97e'); c.setAttribute('stroke', 'none');
      g.appendChild(c);
    });
  });
}

function renderCurrent() {
  const cp = [document.getElementById('cp0'), document.getElementById('cp1'), document.getElementById('cp2')];
  const curLine  = document.getElementById('curLine');
  const curGuide = document.getElementById('curGuide');

  // Placed dots
  cp.forEach((c, i) => {
    if (i < currentPts.length) {
      c.setAttribute('cx', currentPts[i].x);
      c.setAttribute('cy', currentPts[i].y);
      c.setAttribute('visibility', 'visible');
    } else {
      c.setAttribute('visibility', 'hidden');
    }
  });

  // Polyline through placed points
  if (currentPts.length >= 2) {
    curLine.setAttribute('points', ptsToStr(currentPts));
  } else {
    curLine.setAttribute('points', '');
  }

  // Guide line from last placed point to cursor
  if (currentPts.length > 0) {
    const last = currentPts[currentPts.length - 1];
    curGuide.setAttribute('x1', last.x); curGuide.setAttribute('y1', last.y);
    curGuide.setAttribute('x2', cursorPos.x); curGuide.setAttribute('y2', cursorPos.y);
  } else {
    curGuide.setAttribute('x1', 0); curGuide.setAttribute('y1', 0);
    curGuide.setAttribute('x2', 0); curGuide.setAttribute('y2', 0);
  }
}

function renderCursor(x, y) {
  cursorPos = { x, y };
  document.getElementById('chH').setAttribute('x1', 0);   document.getElementById('chH').setAttribute('y1', y);
  document.getElementById('chH').setAttribute('x2', 1280);document.getElementById('chH').setAttribute('y2', y);
  document.getElementById('chV').setAttribute('x1', x);   document.getElementById('chV').setAttribute('y1', 0);
  document.getElementById('chV').setAttribute('x2', x);   document.getElementById('chV').setAttribute('y2', 720);
  document.getElementById('chDot').setAttribute('cx', x); document.getElementById('chDot').setAttribute('cy', y);
  const coord = document.getElementById('chCoord');
  coord.setAttribute('x', x + 6); coord.setAttribute('y', y - 5);
  coord.textContent = `${x},${y}`;
  renderCurrent();
}

/* ============================================================
   UI STATE
============================================================ */
function updateUI() {
  const idx = boundaries.length;
  const done_all = idx >= 10;

  // Topbar
  document.getElementById('stepLabel').textContent = done_all
    ? '✓ Completato!'
    : `Boundary ${idx + 1} di 10`;
  document.getElementById('stepSub').textContent = done_all
    ? 'Copia il codice SVG'
    : BOUNDARY_NAMES[idx] + (currentPts.length > 0 ? ` (punto ${currentPts.length + 1}/3)` : ' (punto 1/3)');

  // Dot row
  for (let i = 0; i < 3; i++) {
    const d = document.getElementById(`d${i}`);
    d.className = 'dot' + (i < currentPts.length ? ' done' : i === currentPts.length && !done_all ? ' active' : '');
  }

  document.getElementById('btnUndo').disabled     = currentPts.length === 0;
  document.getElementById('btnUndoBnd').disabled  = boundaries.length === 0;
  document.getElementById('btnCopy').disabled     = boundaries.length < 10;
  document.getElementById('btnCopy2').disabled    = boundaries.length < 10;

  // Sidebar list
  renderList();

  if (boundaries.length >= 10) generateOutput();
}

function renderList() {
  const el = document.getElementById('bList');
  el.innerHTML = '';
  BOUNDARY_NAMES.forEach((name, i) => {
    const div = document.createElement('div');
    let cls = 'b-item ';
    if (i < boundaries.length) cls += 'done';
    else if (i === boundaries.length) cls += 'active';
    else cls += 'pending';
    div.className = cls;

    const pts = i < boundaries.length ? boundaries[i].pts : null;
    div.innerHTML = `
      <span class="b-num">${i}</span>
      <span class="b-name">${name}</span>
      <span class="b-pts">${pts ? pts.map(p=>`${p.x},${p.y}`).join(' ') : '—'}</span>
      ${pts ? `<button class="b-del" onclick="deleteBoundary(${i})">✕</button>` : ''}
    `;
    el.appendChild(div);
  });
}

/* ============================================================
   INTERACTION
============================================================ */
function registerPoint(x, y) {
  if (boundaries.length >= 10) return;
  currentPts.push({ x, y });

  if (currentPts.length === 3) {
    // Boundary complete
    boundaries.push({ name: BOUNDARY_NAMES[boundaries.length], pts: [...currentPts] });
    currentPts = [];
    renderCompleted();
  }

  renderCurrent();
  updateUI();
}

function undoPoint() {
  if (currentPts.length > 0) {
    currentPts.pop();
    renderCurrent();
    updateUI();
  }
}

function undoBoundary() {
  if (currentPts.length > 0) {
    currentPts = [];
    renderCurrent();
    updateUI();
    return;
  }
  if (boundaries.length > 0) {
    boundaries.pop();
    renderCompleted();
    updateUI();
  }
}

function deleteBoundary(i) {
  boundaries.splice(i);  // remove from i onward
  currentPts = [];
  renderCompleted();
  renderCurrent();
  updateUI();
}

/* ============================================================
   MOUSE / TOUCH
============================================================ */
const wrap = document.getElementById('canvasWrap');

wrap.addEventListener('mousemove', e => {
  const p = toSVG(e.clientX, e.clientY);
  renderCursor(p.x, p.y);
});

wrap.addEventListener('click', e => {
  e.preventDefault();
  const p = toSVG(e.clientX, e.clientY);
  registerPoint(p.x, p.y);
});

wrap.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  const p = toSVG(t.clientX, t.clientY);
  renderCursor(p.x, p.y);
}, { passive: false });

wrap.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const p = toSVG(t.clientX, t.clientY);
  registerPoint(p.x, p.y);
}, { passive: false });

/* ============================================================
   OUTPUT
============================================================ */
function generateOutput() {
  if (boundaries.length < 10) return;

  let out = '<!-- === FLOOR OVERLAY — 3-point perspective ===\n';
  out += '     Generato con floor-detect.html -->\n\n';

  // f-sep lines (boundaries 1-8, skip top and bottom)
  out += '<!-- Separator lines -->\n';
  for (let i = 1; i <= 8; i++) {
    const pts = boundaries[i].pts;
    out += `<polyline class="f-sep" points="${ptsToStr(pts)}"/>\n`;
  }

  // Floor zones
  out += '\n<!-- Floor zones -->\n';
  for (let i = 0; i < 9; i++) {
    const top   = boundaries[i].pts;
    const bot   = boundaries[i + 1].pts;
    const name  = ZONE_NAMES[i];
    const isPlan= (i === HAS_PLAN_IDX);
    const mid_y = Math.round((top[1].y + bot[1].y) / 2);

    // 6-point polygon: top-left, top-mid, top-right, bot-right, bot-mid, bot-left
    const zonePts = [top[0], top[1], top[2], bot[2], bot[1], bot[0]];
    const polyStr = ptsToStr(zonePts);

    out += `\n<!-- ${name} -->\n`;
    if (isPlan) {
      out += `<g class="floor-zone has-plan" id="fz-3" onclick="location.href='piantina.html'">\n`;
      out += `  <polygon class="floor-hit" points="${polyStr}"/>\n`;
      out += `  <polygon class="f-dash" points="${polyStr}"/>\n`;
    } else {
      const fid = name === 'Rooftop' ? 'fz-roof' : `fz-${name.split(' ')[1].replace('°','')}`;
      const floorNum = name === 'Rooftop' ? "'Rooftop'" : name.split(' ')[1].replace('°','');
      out += `<g class="floor-zone" id="${fid}" onclick="floorClick(${floorNum})">\n`;
      out += `  <polygon class="floor-hit" points="${polyStr}"/>\n`;
    }

    const mid_x_left = top[0].x;
    const badge = name === 'Rooftop' ? 'Giardino Pensile' : isPlan ? 'Piantina disponibile →' : '— unità disponibili';
    out += `  <line class="f-tick" x1="232" y1="${mid_y}" x2="${mid_x_left}" y2="${mid_y}"/>\n`;
    out += `  <rect class="f-label-bg" x="48" y="${mid_y - 12}" width="${isPlan ? 214 : 178}" height="30" rx="4"/>\n`;
    out += `  <text class="f-label" x="${isPlan ? 222 : 216}" y="${mid_y + 1}" text-anchor="end">${name}</text>\n`;
    out += `  <text class="f-badge" x="${isPlan ? 222 : 216}" y="${mid_y + 13}" text-anchor="end">${badge}</text>\n`;
    out += `</g>\n`;
  }

  document.getElementById('output').textContent = out;
}

function copyOutput() {
  const text = document.getElementById('output').textContent;
  if (!text || text.startsWith('Completa')) return;
  navigator.clipboard.writeText(text).then(() => {
    const b = document.getElementById('btnCopy');
    const b2 = document.getElementById('btnCopy2');
    b.textContent = '✓ Copiato!';
    b2.textContent = '✓';
    setTimeout(() => { b.textContent = '📋 Copia SVG'; b2.textContent = '📋 Copia'; }, 2000);
  });
}

/* ============================================================
   INIT
============================================================ */
updateUI();
</script>
</body>
</html>
