<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calibrazione piani</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; }
    .wrap { position: relative; width: 100vw; height: 100vh; }
    svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #info {
      position: fixed; top: 0.75rem; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #ffcc00;
      padding: 0.4rem 1rem; border-radius: 4px;
      font-family: monospace; font-size: 1.3rem; z-index: 100;
      pointer-events: none; white-space: nowrap;
    }
    #log {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.9); color: #0f0;
      padding: 0.5rem 0.75rem;
      font-family: monospace; font-size: 0.8rem; z-index: 100;
      max-height: 30vh; overflow-y: auto;
      border-top: 1px solid #333;
    }
    #clear-btn {
      position: fixed; top: 0.75rem; right: 0.75rem;
      background: #c00; color: #fff; border: none;
      padding: 0.4rem 0.8rem; border-radius: 4px;
      font-size: 0.8rem; z-index: 200; cursor: pointer;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div id="info">Tocca il bordo tra un piano e l'altro</div>
  <button id="clear-btn" onclick="clearLog()">Reset</button>
  <svg id="svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
    <image href="assets/frames/frame_0060.jpg" x="0" y="0" width="1280" height="720"/>

    <!-- linee correnti (gialle) -->
    <line x1="480" y1="148" x2="1070" y2="160" stroke="rgba(255,220,0,0.7)" stroke-width="1.5" stroke-dasharray="6,3"/>
    <line x1="480" y1="200" x2="1070" y2="212" stroke="rgba(255,220,0,0.7)" stroke-width="1.5" stroke-dasharray="6,3"/>
    <line x1="480" y1="252" x2="1070" y2="264" stroke="rgba(255,220,0,0.7)" stroke-width="1.5" stroke-dasharray="6,3"/>
    <line x1="480" y1="304" x2="1070" y2="316" stroke="rgba(255,220,0,0.7)" stroke-width="1.5" stroke-dasharray="6,3"/>
    <line x1="480" y1="356" x2="1070" y2="368" stroke="rgba(255,220,0,0.7)" stroke-width="1.5" stroke-dasharray="6,3"/>
    <line x1="480" y1="408" x2="1070" y2="420" stroke="rgba(255,220,0,0.7)" stroke-width="1.5" stroke-dasharray="6,3"/>
    <line x1="480" y1="460" x2="1070" y2="472" stroke="rgba(255,220,0,0.7)" stroke-width="1.5" stroke-dasharray="6,3"/>
    <line x1="480" y1="512" x2="1070" y2="524" stroke="rgba(255,220,0,0.7)" stroke-width="1.5" stroke-dasharray="6,3"/>

    <!-- griglia di riferimento ogni 50px -->
    <g id="grid" opacity="0.25">
      <line x1="0" y1="50"  x2="1280" y2="50"  stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="100" x2="1280" y2="100" stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="150" x2="1280" y2="150" stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="200" x2="1280" y2="200" stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="250" x2="1280" y2="250" stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="300" x2="1280" y2="300" stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="350" x2="1280" y2="350" stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="400" x2="1280" y2="400" stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="450" x2="1280" y2="450" stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="500" x2="1280" y2="500" stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="550" x2="1280" y2="550" stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="600" x2="1280" y2="600" stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="650" x2="1280" y2="650" stroke="#fff" stroke-width="0.5"/>
      <text x="8" y="48"  fill="#fff" font-size="11" font-family="monospace" opacity="0.6">50</text>
      <text x="8" y="98"  fill="#fff" font-size="11" font-family="monospace" opacity="0.6">100</text>
      <text x="8" y="148" fill="#fff" font-size="11" font-family="monospace" opacity="0.6">150</text>
      <text x="8" y="198" fill="#fff" font-size="11" font-family="monospace" opacity="0.6">200</text>
      <text x="8" y="248" fill="#fff" font-size="11" font-family="monospace" opacity="0.6">250</text>
      <text x="8" y="298" fill="#fff" font-size="11" font-family="monospace" opacity="0.6">300</text>
      <text x="8" y="348" fill="#fff" font-size="11" font-family="monospace" opacity="0.6">350</text>
      <text x="8" y="398" fill="#fff" font-size="11" font-family="monospace" opacity="0.6">400</text>
      <text x="8" y="448" fill="#fff" font-size="11" font-family="monospace" opacity="0.6">450</text>
      <text x="8" y="498" fill="#fff" font-size="11" font-family="monospace" opacity="0.6">500</text>
      <text x="8" y="548" fill="#fff" font-size="11" font-family="monospace" opacity="0.6">550</text>
      <text x="8" y="598" fill="#fff" font-size="11" font-family="monospace" opacity="0.6">600</text>
      <text x="8" y="648" fill="#fff" font-size="11" font-family="monospace" opacity="0.6">650</text>
    </g>

    <!-- cursore tap -->
    <line id="cursor" x1="0" y1="-999" x2="1280" y2="-999" stroke="red" stroke-width="1.5" pointer-events="none"/>

    <!-- area cliccabile -->
    <rect id="hitarea" x="0" y="0" width="1280" height="720" fill="transparent"/>
  </svg>
  <div id="log">Tocca i bordi dei piani (da cima a fondo). Le linee gialle tratteggiate sono quelle attuali.</div>
</div>
<script>
  const svg   = document.getElementById('svg');
  const info  = document.getElementById('info');
  const log   = document.getElementById('log');
  const cursor = document.getElementById('cursor');
  const taps  = [];

  function svgY(clientX, clientY) {
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    return Math.round(pt.matrixTransform(svg.getScreenCTM().inverse()).y);
  }

  function registerTap(cx, cy) {
    const y = svgY(cx, cy);
    cursor.setAttribute('y1', y);
    cursor.setAttribute('y2', y);
    taps.push(y);
    info.textContent = `y = ${y}  (tocco ${taps.length})`;
    log.innerHTML = '<b>y toccati:</b> ' + taps.join(', ') +
      '<br><small>Manda questo elenco a Claude</small>';
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById('hitarea').addEventListener('click', e => {
    registerTap(e.clientX, e.clientY);
  });
  document.getElementById('hitarea').addEventListener('touchend', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    registerTap(t.clientX, t.clientY);
  }, { passive: false });

  function clearLog() { taps.length = 0; log.innerHTML = 'Reset. Riparti.'; cursor.setAttribute('y1',-999); cursor.setAttribute('y2',-999); info.textContent = 'Tocca il bordo tra un piano e l\'altro'; }
</script>
</body>
</html>
